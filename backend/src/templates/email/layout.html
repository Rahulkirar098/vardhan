<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Nuvince</title>
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
    @media screen and (max-width: 600px) {
      .email-container { width: 100% !important; margin: auto !important; }
      .fluid { max-width: 100% !important; height: auto !important; margin-left: auto !important; margin-right: auto !important; }
      .stack-column, .stack-column-center { display: block !important; width: 100% !important; max-width: 100% !important; direction: ltr !important; }
      .padding-mobile { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="background-color: #FAFAFA; margin: 0; padding: 0; -webkit-font-smoothing: antialiased;">
  <!-- HIDDEN PREHEADER TEXT -->
  <div style="display: none; font-size: 1px; color: #FAFAFA; line-height: 1px; font-family: sans-serif; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;">
    Nuvince Hospital Workforce Management Notification
  </div>

  <!-- CONTAINER TABLE -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" style="background-color: #FAFAFA; table-layout: fixed;">
    <tr>
      <td align="center" style="padding: 40px 16px 40px 16px;">
        <!--[if mso]>
        <table align="center" border="0" cellspacing="0" cellpadding="0" width="600">
        <tr>
        <td align="center" valign="top" width="600">
        <![endif]-->
        
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container" style="max-width: 600px; background-color: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);">
          
          <!-- BRAND HEADER -->
          <tr>
            <td align="left" style="padding: 32px 40px 24px 40px; border-bottom: 1px solid #F0F0F0;" class="padding-mobile">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td valign="middle" style="padding-right: 12px;">
                    <div style="background-color: #0A0A0A; color: #FFFFFF; font-weight: 800; font-size: 18px; width: 38px; height: 38px; line-height: 38px; text-align: center; border-radius: 10px; font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
                      N
                    </div>
                  </td>
                  <td valign="middle">
                    <div style="font-weight: 800; font-size: 18px; color: #0A0A0A; letter-spacing: -0.3px; line-height: 1.1; font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
                      NUVINCE
                    </div>
                    <div style="font-size: 9.5px; font-weight: 700; color: #737373; letter-spacing: 0.9px; text-transform: uppercase; margin-top: 2px; font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
                      HOSPITAL WORKFORCE PLATFORM
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- MAIN CONTENT BODY -->
          <tr>
            <td align="left" style="padding: 36px 40px 36px 40px; color: #171717; font-size: 15px; line-height: 1.6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;" class="padding-mobile">
              {{content}}
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td align="left" style="padding: 24px 40px 32px 40px; background-color: #FAFAFA; border-top: 1px solid #F0F0F0; color: #737373; font-size: 12px; line-height: 1.5; font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;" class="padding-mobile">
              <p style="margin: 0 0 8px 0; font-weight: 600; color: #404040;">
                Nuvince — Hospital Workforce Management Platform
              </p>
              <p style="margin: 0 0 12px 0;">
                This is an automated system email. Please do not reply directly to this message.
              </p>
              <p style="margin: 0; color: #A3A3A3; font-size: 11px;">
                © {{year}} Nuvince. All rights reserved.
              </p>
            </td>
          </tr>

        </table>

        <!--[if mso]>
        </td>
        </tr>
        </table>
        <![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
