<h2 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #0A0A0A; letter-spacing: -0.4px;">
  Leave Request {{leaveStatus}}
</h2>

<p style="margin: 0 0 16px 0; color: #404040; font-size: 15px; line-height: 1.6;">
  Hello <strong>{{employeeName}}</strong>,
</p>

<p style="margin: 0 0 20px 0; color: #404040; font-size: 15px; line-height: 1.6;">
  Your leave request has been reviewed by management and marked as <strong>{{leaveStatus}}</strong>.
</p>

<!-- DETAILS CARD TABLE -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F7F7F7; border: 1px solid #E5E5E5; border-radius: 12px; margin: 24px 0; font-size: 14px; color: #171717;">
  <tr>
    <td style="padding: 16px 20px; border-bottom: 1px solid #E5E5E5; font-weight: 600; color: #737373; width: 130px;">
      Status
    </td>
    <td style="padding: 16px 20px; border-bottom: 1px solid #E5E5E5; font-weight: 700;">
      {{leaveStatus}}
    </td>
  </tr>
  <tr>
    <td style="padding: 16px 20px; border-bottom: 1px solid #E5E5E5; font-weight: 600; color: #737373;">
      Leave Type
    </td>
    <td style="padding: 16px 20px; border-bottom: 1px solid #E5E5E5; font-weight: 600;">
      {{leaveType}}
    </td>
  </tr>
  <tr>
    <td style="padding: 16px 20px; border-bottom: 1px solid #E5E5E5; font-weight: 600; color: #737373;">
      Dates
    </td>
    <td style="padding: 16px 20px; border-bottom: 1px solid #E5E5E5; font-weight: 600;">
      {{leaveStartDate}} to {{leaveEndDate}}
    </td>
  </tr>
  <tr>
    <td style="padding: 16px 20px; font-weight: 600; color: #737373;">
      Comment
    </td>
    <td style="padding: 16px 20px; color: #404040;">
      {{decisionComment}}
    </td>
  </tr>
</table>

<!-- BUTTON -->
<table border="0" cellspacing="0" cellpadding="0" style="margin: 28px 0;">
  <tr>
    <td align="center" style="border-radius: 8px; background-color: #0A0A0A;">
      <a href="{{dashboardUrl}}" target="_blank" style="font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif; color: #FFFFFF; text-decoration: none; border-radius: 8px; padding: 12px 24px; border: 1px solid #0A0A0A; display: inline-block; font-weight: 600; letter-spacing: -0.1px;">
        View Leave Status on Dashboard
      </a>
    </td>
  </tr>
</table>
